name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Build Windows only or all desktop platforms
        type: choice
        options: [windows, all]
        default: windows

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '[{"platform":"windows-latest","args":"--bundles nsis"}]' || '[{"platform":"macos-latest","args":"--target universal-apple-darwin --bundles dmg"},{"platform":"windows-latest","args":"--bundles nsis"},{"platform":"ubuntu-22.04","args":"--bundles deb,appimage"}]') }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2 xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary requires both Apple targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Test frontend logic
        run: npm test

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Install headless Chromium
        if: matrix.platform == 'windows-latest'
        run: npx playwright install chromium

      - name: Test PC workflows without a desktop window
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/test-pc-headless.ps1

      - name: Build desktop installers
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Collect Windows EXE and checksums
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/collect-windows-package.ps1

      - name: Upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: P5JS-Studio-Windows-${{ github.sha }}
          path: |
            artifacts/ci-package/*.exe
            artifacts/ci-package/SHA256SUMS.txt
            artifacts/ci-package/build-info.json
            artifacts/ci-package/更新说明.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS installer
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: P5JS-Studio-macOS-${{ github.sha }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: P5JS-Studio-Linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows test diagnostics
        if: always() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: PC-workflow-checks-${{ github.sha }}
          path: artifacts/validation/pc-workflow/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: P5JS-Studio-*-${{ github.sha }}
          path: packages

      - name: Publish GitHub Release with all installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir release
          cp packages/P5JS-Studio-Windows-*/*.exe "release/P5JS-Studio-${version}-windows-x64-setup.exe"
          cp packages/P5JS-Studio-macOS-*/*.dmg "release/P5JS-Studio-${version}-macos-universal.dmg"
          cp packages/P5JS-Studio-Linux-*/deb/*.deb "release/P5JS-Studio-${version}-linux-amd64.deb"
          cp packages/P5JS-Studio-Linux-*/appimage/*.AppImage "release/P5JS-Studio-${version}-linux-x86_64.AppImage"
          cd release
          sha256sum ./*.exe ./*.dmg ./*.deb ./*.AppImage | sed 's|  ./|  |' > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "P5JS Studio $GITHUB_REF_NAME" --notes-from-tag \
            ./*.exe ./*.dmg ./*.deb ./*.AppImage SHA256SUMS.txt
